name: infra Terraform

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.12.2"
  TF_WORKING_DIR: kubernetes-veeraops-ecommerce-microservices-app/EKS-Terraform
  BUCKET_NAME: paddhubucket

jobs:

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================
  terraform-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # VERIFY AWS
      # ----------------------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # SETUP TERRAFORM
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------------------
      # CREATE S3 BUCKET IF NOT EXISTS
      # ----------------------------------------------------------
      - name: Create S3 Bucket if not exists
        run: |
          BUCKET_NAME="${{ env.BUCKET_NAME }}"
          AWS_REGION="${{ env.AWS_REGION }}"

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket already exists. Skipping creation."
          else
            echo "Bucket does not exist. Creating..."

            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi

            echo "Bucket created successfully."
          fi

      # ----------------------------------------------------------
      # VERIFY S3 BUCKET
      # ----------------------------------------------------------
      - name: Verify S3 Bucket
        run: |
          aws s3api head-bucket \
            --bucket "${{ env.BUCKET_NAME }}"

          echo "S3 bucket is available."

      # ----------------------------------------------------------
      # TERRAFORM VERSION
      # ----------------------------------------------------------
      - name: Terraform Version
        run: terraform version

      # ----------------------------------------------------------
      # TERRAFORM INIT
      # ----------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # ----------------------------------------------------------
      # TERRAFORM VALIDATE
      # ----------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # ----------------------------------------------------------
      # TERRAFORM PLAN
      # ----------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -out=tfplan

      # ----------------------------------------------------------
      # VERIFY PLAN FILE
      # ----------------------------------------------------------
      - name: Verify Terraform Plan File
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          pwd
          ls -la
          test -f tfplan
          echo "Terraform plan file exists successfully."

      # ----------------------------------------------------------
      # UPLOAD TERRAFORM PLAN
      # ----------------------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5


  # ============================================================
  # TERRAFORM APPLY
  # ============================================================
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # VERIFY AWS
      # ----------------------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # SETUP TERRAFORM
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------------------------
      # TERRAFORM VERSION
      # ----------------------------------------------------------
      - name: Terraform Version
        run: terraform version

      # ----------------------------------------------------------
      # TERRAFORM INIT
      # ----------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # ----------------------------------------------------------
      # DOWNLOAD TERRAFORM PLAN
      # ----------------------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      # ----------------------------------------------------------
      # VERIFY DOWNLOADED PLAN
      # ----------------------------------------------------------
      - name: Verify Downloaded Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          pwd
          ls -la
          test -f tfplan
          echo "Terraform plan downloaded successfully."

      # ----------------------------------------------------------
      # TERRAFORM APPLY
      # ----------------------------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve tfplan

      # ----------------------------------------------------------
      # TERRAFORM OUTPUTS
      # ----------------------------------------------------------
      - name: Terraform Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform output
